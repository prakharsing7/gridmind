[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmind"
version = "0.1.0"
description = "Optimise EV charging schedules and output OCPP-native ChargingProfile messages"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Prakhar Singh", email = "prakharsing7@gmail.com"},
]
keywords = ["OCPP", "EV", "electric vehicle", "smart charging", "energy optimisation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cvxpy>=1.4.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "numpy>=1.26.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.90.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "gitlint>=0.19.1",
]
all = ["gridmind[viz,dev]"]

[project.scripts]
gridmind = "gridmind.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["gridmind*"]

[tool.setuptools.package-data]
"gridmind" = ["ocpp/v16/schemas/*.json"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gridmind --cov-report=term-missing --cov-report=html --cov-fail-under=85"

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false   # enforce double-quoted strings

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernise to Python 3.11+ syntax)
    "B",    # flake8-bugbear (likely bugs and bad practices)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # misc improvements
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",    # line-too-long — Black handles this
    "B008",    # function-call-in-default-argument — needed for Click decorators
    "N815",    # mixed-case-variable — OCPP spec mandates camelCase field names
]

[tool.ruff.lint.isort]
known-first-party = ["gridmind"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert statements are fine in tests

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["cvxpy.*", "matplotlib.*", "seaborn.*", "jsonschema.*"]
ignore_missing_imports = true

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["gridmind"]
omit = ["tests/*", "*/future.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 85
